# Conservative default for direct Cargo runs. Historical wider
# runs exceeded the 20 GiB limit (DECISIONS 34). The explicit release gate
# may select up to four threads under tools/memcap.sh; its child-only marker
# is checked by diff::floors::tests::the_gate_has_a_bounded_test_width.
# Measured adoption evidence: docs/lab/2026-09-10-test-concurrency.md.
[env]
RUST_TEST_THREADS = "2"
