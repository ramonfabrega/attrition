[workspace]
resolver = "3"
members = ["crates/client", "crates/fixed", "crates/rondata", "crates/render", "crates/sim"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rfabrega/attrition"

[workspace.lints.rust]
# The sim must never reach for floating point. This makes it loud.
unsafe_code = "forbid"

# One module layout (item 4032, `docs/STRUCTURE.md` §5.11): a directory
# module is `foo.rs` beside `foo/`, never `foo/mod.rs`.
[workspace.lints.clippy]
mod_module_files = "deny"

# The dev profile keeps line tables and nothing else, and the dependencies
# keep none (item 4216, stage 0). Measured on a clean build of every
# workspace test target: 3,969,920 KiB and 38.3 s with full debug info,
# 3,003,948 KiB and 33.2 s with this. A panic's backtrace still names each
# frame's file and line; a frame's function loses its module path, and a
# debugger no longer prints a local.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
# Determinism: identical codegen assumptions across builds.
overflow-checks = true
# Reuse compiler work after local edits; never reuse test verdicts.
# Measured build/runtime tradeoffs: docs/journal/2026-10-16-build-invalidation.md.
incremental = true
codegen-units = 256
