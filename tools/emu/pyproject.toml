# tools/emu's one environment (item 3354). The sweeps run as
# `uv run --locked --project tools/emu python <script>`, on `tools/emu/.venv`
# (gitignored, made by uv on the first run), not on a bare `uv run <script>`:
# that builds a PEP 723 environment per script *path*, so every worktree
# built ~1,600 of them under ~/.cache/uv/environments-v2. The scripts keep
# their inline metadata for a person's bare `uv run`;
# tools/explore/test_emu_env.py holds the two declarations equal.
[project]
name = "attrition-emu"
version = "0"
requires-python = ">=3.12"
dependencies = ["unicorn==2.1.4"]

[tool.uv]
package = false
