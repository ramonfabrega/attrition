[package]
name = "sim"
edition.workspace = true
license.workspace = true
repository.workspace = true
version = "0.1.0"

# No graphics, no windowing, no async runtime, no clock. If it cannot run in a
# `#[test]` with no display attached, it does not belong here.
[dependencies]
# Nothing yet. Three mechanics in, the simulation has needed no fraction: every
# quantity the original computes is an integer with a defined truncation. `fixed`
# will be earned when something genuinely needs one. See docs/DECISIONS.md 13.

# Cargo will not combine `workspace = true` with a crate's own lint table,
# so the workspace's one rule is restated here beside the sim's own two.
[lints.rust]
unsafe_code = "forbid"

# The no-float rule, at build time as well as in `no_float.rs`'s source
# read: no float arithmetic in the simulation. Clippy leaves `#[cfg(test)]`
# code alone, which is where the single-precision oracles that pin the
# integer clocks live (`farms.rs`), so they need no `#[expect]`.
# And no hash-keyed collections (`clippy.toml`): an iteration over one is a
# desync that only shows in a long diff — the ordered maps cost nothing.
[lints.clippy]
float_arithmetic = "deny"
disallowed_types = "deny"
