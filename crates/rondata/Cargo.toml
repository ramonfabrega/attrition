[package]
name = "rondata"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Reads Rise of Nations' shipped data tables out of an installed copy"

[dependencies]
fixed = { path = "../fixed" }
# The recorded-game container (docs/RECGAME.md) is a gzip stream; the engine
# writes it through gzwrite. Reading it back is what earns this one.
flate2 = "1"
roxmltree = "0.21"
# The simulation writes down the tuned numbers it depends on. This crate is
# where they get re-checked against the user's own copy of the game, which is
# the only thing that stops them going quietly stale.
sim = { path = "../sim" }

# The workspace forbids `unsafe`, and this crate is under it like every
# other — item 280. Item 260 took it down to `deny` with one module
# exempt, for a memory-mapped capture; `src/capture.rs` says why that was
# a bad trade and `docs/DECISIONS.md` 35 records the rule that stands.
[lints]
workspace = true
