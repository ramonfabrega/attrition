[package]
name = "rondata"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Reads Rise of Nations' shipped data tables out of an installed copy"

[dependencies]
fixed = { path = "../fixed" }
# The recorded-game container (docs/RECGAME.md) is a gzip stream; the engine
# writes it through gzwrite. Reading it back is what earns this one.
flate2 = "1"
roxmltree = "0.21"
# The simulation writes down the tuned numbers it depends on. This crate is
# where they get re-checked against the user's own copy of the game, which is
# the only thing that stops them going quietly stale.
sim = { path = "../sim" }

# The workspace forbids `unsafe`, and `crates/sim` and `crates/fixed` keep
# that — the simulation is the thing that must be provably plain. This
# crate is the host-side reader, and item 260's answer is a **memory-mapped
# capture**: a mapping cannot be made in safe Rust, by anyone, and no crate
# hides it (`memmap2::Mmap::map` is itself an `unsafe fn`). So the ban stays
# on by default here and `src/mapped.rs` — the one module whose whole job is
# the mapping — turns it off for itself.
[lints.rust]
unsafe_code = "deny"
